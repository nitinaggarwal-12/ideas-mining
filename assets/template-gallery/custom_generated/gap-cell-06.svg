<text x="646.0" y="740.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#7C3AED">04 • MEASURED BREAKTHROUGH</text>
<text x="646.0" y="758.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F172A">+22pp on NoveltyBench</text>
