<rect x="1036.0" y="32.0" width="508" height="22" rx="11.0" fill="#0F2942" stroke="#38BDF8" stroke-width="1.4"/><text x="1290.0" y="46.6" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#38BDF8" text-anchor="middle" >FORMAT LINEAGE: Simon Willison, The lethal trifecta for AI agents (Jun 2025)</text>
<text x="56.0" y="80.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start" >The Lethal Trifecta: If Your Agent Has All Three, Someone Can Make It Leak</text>
<text x="56.0" y="103.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start" >Simon Willison&#x27;s five-second security test. Private data + untrusted content + a way to send things out = exfiltration waiting for the right PDF.</text>
<rect x="56.0" y="136.0" width="920.0" height="740.0" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" />
