<text x="540.0" y="524.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >2</text>
<circle cx="510" cy="380" r="11" fill="#D97706" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="510.0" y="384.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >3</text>
