<circle cx="510" cy="610" r="190" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-width="2.5"/>
<text x="230.0" y="258.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start" >ACCESS TO PRIVATE DATA</text>
<text x="230.0" y="274.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="start" >inbox, CRM, database, source code,</text>
<text x="230.0" y="286.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="start" >files</text>
<text x="790.0" y="258.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#D97706" text-anchor="end" >EXPOSURE TO UNTRUSTED CONTENT</text>
<text x="790.0" y="274.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="end" >web pages, PDFs, emails, tickets,</text>
<text x="790.0" y="286.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="end" >tool results</text>
<text x="510.0" y="826.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="middle" >ABILITY TO COMMUNICATE OUT</text>
<text x="510.0" y="842.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" >send email, POST webhook, open</text>
<text x="510.0" y="854.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" >URL, write issue</text>
