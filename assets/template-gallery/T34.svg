<text x="470.0" y="354.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >6</text>
<text x="516.0" y="858.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" >Dots are placed by which legs each setup has; the red core is the only region where a prompt injection becomes a data breach.</text>
<rect x="1000.0" y="136.0" width="564.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" /><rect x="1000.0" y="136.0" width="564.0" height="26.0" rx="8" fill="#DC2626" /><text x="1282.0" y="153.2" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" >SIX REAL SETUPS — WHICH LEGS DO THEY HAVE?</text>
<rect x="1016.0" y="176.0" width="532.0" height="60.0" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.4" />
<circle cx="1038" cy="198" r="11" fill="#DC2626"/>
<text x="1038.0" y="202.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="1058.0" y="196.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="start" >Inbox assistant that reads and sends mail</text>
<text x="1536.0" y="196.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#DC2626" text-anchor="end" >ALL THREE</text>
<text x="1058.0" y="216.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1E293B" text-anchor="start" >A crafted email can instruct it to forward your threads.</text>
<rect x="1016.0" y="246.0" width="532.0" height="60.0" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.4" />
<circle cx="1038" cy="268" r="11" fill="#DC2626"/>
<text x="1038.0" y="272.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="1058.0" y="266.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="start" >Browser agent using your logged-in sessions</text>
<text x="1536.0" y="266.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#DC2626" text-anchor="end" >ALL THREE</text>
<text x="1058.0" y="286.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1E293B" text-anchor="start" >Any page it visits can steer it; it can act as you.</text>
<rect x="1016.0" y="316.0" width="532.0" height="60.0" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.4" />
<circle cx="1038" cy="338" r="11" fill="#D97706"/>
<text x="1038.0" y="342.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="1058.0" y="336.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="start" >Coding agent in a sandbox with no network</text>
<text x="1536.0" y="336.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#D97706" text-anchor="end" >DATA + UNTRUSTED</text>
<text x="1058.0" y="356.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1E293B" text-anchor="start" >Repo + issues are untrusted, but nothing can leave the box.</text>
<rect x="1016.0" y="386.0" width="532.0" height="60.0" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.4" />
<circle cx="1038" cy="408" r="11" fill="#D97706"/>
<text x="1038.0" y="412.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="1058.0" y="406.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="start" >Public web researcher, no private data</text>
<text x="1536.0" y="406.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#D97706" text-anchor="end" >UNTRUSTED + OUT</text>
<text x="1058.0" y="426.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1E293B" text-anchor="start" >Can be hijacked, but has nothing of yours to leak.</text>
<rect x="1016.0" y="456.0" width="532.0" height="60.0" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.4" />
<circle cx="1038" cy="478" r="11" fill="#059669"/>
<text x="1038.0" y="482.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >5</text>
<text x="1058.0" y="476.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="start" >Internal SQL analyst, no web, no sending</text>
<text x="1536.0" y="476.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#059669" text-anchor="end" >DATA ONLY</text>
<text x="1058.0" y="496.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1E293B" text-anchor="start" >Reads sensitive data; no untrusted input, no exit.</text>
<rect x="1016.0" y="526.0" width="532.0" height="60.0" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.4" />
<circle cx="1038" cy="548" r="11" fill="#059669"/>
<text x="1038.0" y="552.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" >6</text>
<text x="1058.0" y="546.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="start" >Doc summarizer with write tools unmounted</text>
<text x="1536.0" y="546.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#059669" text-anchor="end" >DATA + UNTRUSTED</text>
<text x="1058.0" y="566.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1E293B" text-anchor="start" >Capability downgrade removed the third leg at runtime.</text>
<rect x="1000.0" y="626.0" width="564.0" height="250.0" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" /><rect x="1000.0" y="626.0" width="564.0" height="26.0" rx="8" fill="#059669" /><text x="1282.0" y="643.2" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" >THE FIX IS STRUCTURAL: REMOVE ONE LEG</text>
<rect x="1016.0" y="666.0" width="532.0" height="54.0" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2" />
<text x="1030.0" y="686.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#065F46" text-anchor="start" >Remove &#x27;communicate out&#x27; while reading untrusted content</text>
<text x="1030.0" y="704.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#064E3B" text-anchor="start" >Taint the session on ingress; unmount send_email / webhook / URL tools</text>
<rect x="1016.0" y="730.0" width="532.0" height="54.0" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2" />
<text x="1030.0" y="750.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#065F46" text-anchor="start" >Remove &#x27;private data&#x27; from the reading agent</text>
<text x="1030.0" y="768.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#064E3B" text-anchor="start" >Split roles: one agent reads the web with no data access, another with</text>
<rect x="1016.0" y="794.0" width="532.0" height="54.0" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2" />
<text x="1030.0" y="814.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#065F46" text-anchor="start" >Make &#x27;communicate out&#x27; require a human</text>
<text x="1030.0" y="832.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#064E3B" text-anchor="start" >Any outbound action after untrusted input needs a signed approval (Cloud</text>
<rect x="56.0" y="892.0" width="1508.0" height="40.0" rx="10" fill="#0F2942" />
<text x="810.0" y="917.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Scanners (Model Armor, Llama Guard) lower the odds; removing a leg removes the outcome.</text>
<text x="56.0" y="964.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#64748B" text-anchor="start" >Curated by Nitin Aggarwal  •  Google Cloud ADK + OpenHands Factory  •  Proprietary + Confidential</text>
<text x="1544.0" y="964.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="end" >Simon Willison, &#x27;The lethal trifecta for AI agents&#x27; (Jun 2025) • Google Cloud Model Armor • OPA tool policies</text>
