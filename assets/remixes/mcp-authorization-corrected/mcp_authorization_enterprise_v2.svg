<marker id="ar" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,1 L1,4 L8,7 Z" fill="#1E293B"/></marker>
</defs>
<rect width="1080" height="1350" fill="#F8FAFC"/>
<rect x="0" y="0" width="270" height="5" fill="#4285F4"/>
<rect x="270" y="0" width="270" height="5" fill="#EA4335"/>
<rect x="540" y="0" width="270" height="5" fill="#FBBC04"/>
<rect x="810" y="0" width="270" height="5" fill="#34A853"/>
<rect x="272" y="20" width="492" height="44" rx="8" fill="#FDE047"/>
<text x="540" y="53" text-anchor="middle" font-size="34" font-weight="900" fill="#0F172A">How Enterprise MCP Authorization Works</text>
<text x="540" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">How an AI app gets scoped, audience-bound, On-Behalf-Of access to a remote MCP server</text>
<rect x="20" y="112" width="1040" height="274" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M20,126 a14,14 0 0 1 14,-14 h1012 a14,14 0 0 1 14,14 v22 h-1040 z" fill="#1E293B"/>
<text x="540" y="136" text-anchor="middle" font-size="17" font-weight="800" fill="#FDE047">Who’s Involved</text>
<text x="1046" y="135" text-anchor="end" font-size="11" font-weight="700" fill="#E2E8F0">MCP 2025-11-25 · OAuth 2.1 + RFC 8693 OBO</text>
<rect x="34" y="156" width="204" height="96" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
<text x="46" y="180" font-size="14" font-weight="800" fill="#0F172A">User</text>
<text x="46" y="198" font-size="11" font-weight="700" fill="#475569">Resource owner</text>
<text x="46" y="220" font-size="11.5" fill="#1E293B">Signs in &amp; approves scoped access</text>
<rect x="278" y="156" width="220" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="290" y="180" font-size="14" font-weight="800" fill="#0F172A">MCP Client</text>
<text x="290" y="198" font-size="11" font-weight="700" fill="#475569">OAuth 2.1 client</text>
<text x="290" y="220" font-size="11.5" fill="#1E293B">Host app (IDE, chat, ADK agent)</text>
<rect x="538" y="156" width="232" height="96" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="550" y="180" font-size="14" font-weight="800" fill="#0F172A">MCP Server</text>
<text x="550" y="198" font-size="11" font-weight="700" fill="#475569">OAuth resource server</text>
<text x="550" y="220" font-size="11.5" fill="#1E293B">Publishes RFC 9728, checks JWT + aud</text>
<rect x="810" y="156" width="236" height="96" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="822" y="180" font-size="14" font-weight="800" fill="#0F172A">Upstream API</text>
<text x="822" y="198" font-size="11" font-weight="700" fill="#475569">Optional (GitHub · Gmail · Jira)</text>
<text x="822" y="220" font-size="11.5" fill="#1E293B">Per-caller OBO token (never client’s)</text>
<rect x="278" y="296" width="492" height="78" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="290" y="320" font-size="14" font-weight="800" fill="#0F172A">Authorization Server / IAM STS</text>
<text x="290" y="338" font-size="11" font-weight="700" fill="#475569">Separate role (co-hosted or IdP-delegated)</text>
<text x="290" y="360" font-size="11.5" fill="#1E293B">PKCE consent + aud tokens + RFC 8693 OBO swap</text>
<rect x="810" y="282" width="236" height="92" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="820" y="302" font-size="11" font-weight="800" fill="#5B21B6">NO STATIC KEYS / NO PASSTHROUGH</text>
<text x="820" y="320" font-size="11" fill="#1E293B">MCP Server swaps caller identity via</text>
<text x="820" y="336" font-size="11" font-weight="700" fill="#1E293B">RFC 8693 OBO (or Token Vault)</text>
<text x="820" y="352" font-size="11" fill="#1E293B">to prevent Confused-Deputy bypass.</text>
<line x1="238" y1="204" x2="274" y2="204" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
<line x1="498" y1="204" x2="534" y2="204" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
<line x1="770" y1="204" x2="806" y2="204" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
<path d="M136,252 L136,335 L274,335" fill="none" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
<text x="150" y="325" font-size="11" font-weight="700" fill="#0F172A">login + consent</text>
<line x1="388" y1="254" x2="388" y2="294" stroke="#0F172A" stroke-width="2" marker-start="url(#ar)" marker-end="url(#a)"/>
<text x="398" y="278" font-size="11" font-weight="700" fill="#0F172A">discover · register · token</text>
<line x1="654" y1="254" x2="654" y2="294" stroke="#0F172A" stroke-width="2" stroke-dasharray="5,3.5" marker-start="url(#ar)" marker-end="url(#a)"/>
<text x="664" y="278" font-size="11" font-weight="700" fill="#0F172A">names AS &amp; OBO swap</text>
<rect x="20" y="396" width="1040" height="734" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M20,410 a14,14 0 0 1 14,-14 h1012 a14,14 0 0 1 14,14 v22 h-1040 z" fill="#1E293B"/>
<text x="540" y="420" text-anchor="middle" font-size="17" font-weight="800" fill="#FDE047">The Flow, Step by Step</text>
<text x="1046" y="419" text-anchor="end" font-size="11" font-weight="700" fill="#E2E8F0">7 PHASES · 16 VERIFIED STEPS</text>
<rect x="21" y="475.0" width="1038" height="73.6" fill="#F1F5F9"/>
<circle cx="44" cy="511.8" r="11" fill="#0F172A"/>
<text x="44" y="515.8" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
<text x="62" y="515.8" font-size="13" font-weight="800" fill="#0F172A">Challenge</text>
<rect x="21" y="548.6" width="1038" height="110.4" fill="#FFFFFF"/>
<circle cx="44" cy="603.8" r="11" fill="#0F172A"/>
<text x="44" y="607.8" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
<text x="62" y="607.8" font-size="13" font-weight="800" fill="#0F172A">Discover</text>
<rect x="21" y="659.0" width="1038" height="36.8" fill="#F1F5F9"/>
<circle cx="44" cy="677.4" r="11" fill="#0F172A"/>
<text x="44" y="681.4" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">3</text>
<text x="62" y="681.4" font-size="13" font-weight="800" fill="#0F172A">Register</text>
<rect x="21" y="695.8" width="1038" height="147.2" fill="#FFFFFF"/>
<circle cx="44" cy="769.4" r="11" fill="#0F172A"/>
<text x="44" y="773.4" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">4</text>
<text x="62" y="773.4" font-size="13" font-weight="800" fill="#0F172A">Authorize</text>
<rect x="21" y="843.0" width="1038" height="73.6" fill="#F1F5F9"/>
<circle cx="44" cy="879.8" r="11" fill="#0F172A"/>
<text x="44" y="883.8" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">5</text>
<text x="62" y="883.8" font-size="13" font-weight="800" fill="#0F172A">Token</text>
<rect x="21" y="916.6" width="1038" height="73.6" fill="#FFFFFF"/>
<circle cx="44" cy="953.4" r="11" fill="#0F172A"/>
<text x="44" y="957.4" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">6</text>
<text x="62" y="957.4" font-size="13" font-weight="800" fill="#0F172A">Call &amp; Verify</text>
<rect x="21" y="990.2" width="1038" height="73.6" fill="#F5F3FF"/>
<circle cx="44" cy="1027.0" r="11" fill="#0F172A"/>
<text x="44" y="1031.0" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">7</text>
<text x="62" y="1031.0" font-size="13" font-weight="800" fill="#0F172A">Upstream OBO</text>
<rect x="182.0" y="442" width="124" height="28" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
<text x="244" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#854D0E">User / Browser</text>
<line x1="244" y1="470" x2="244" y2="1072" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="363.0" y="442" width="122" height="28" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="424" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#1E40AF">MCP Client</text>
<line x1="424" y1="470" x2="424" y2="1072" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="562.0" y="442" width="124" height="28" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="624" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#065F46">MCP Server</text>
<line x1="624" y1="470" x2="624" y2="1072" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="757.0" y="442" width="138" height="28" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="826" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#92400E">Auth Server / STS</text>
<line x1="826" y1="470" x2="826" y2="1072" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="932.0" y="442" width="116" height="28" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="990" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#5B21B6">Upstream API</text>
<line x1="990" y1="470" x2="990" y2="1072" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="424" y1="505.0" x2="618" y2="505.0" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="524" y="492.0" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">1. POST /mcp (no token) + MCP-Protocol-Version</text>
<line x1="624" y1="541.8" x2="430" y2="541.8" stroke="#1E293B" stroke-width="1.8" stroke-dasharray="6,4"  marker-end="url(#a)"/>
<text x="524" y="528.8" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">2. 401 + WWW-Authenticate: resource_metadata, scope</text>
<line x1="424" y1="578.6" x2="618" y2="578.6" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="524" y="565.6" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">3. GET /.well-known/oauth-protected-resource (RFC 9728)</text>
<line x1="624" y1="615.4" x2="430" y2="615.4" stroke="#1E293B" stroke-width="1.8" stroke-dasharray="6,4"  marker-end="url(#a)"/>
<text x="524" y="602.4" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">4. authorization_servers, scopes_supported, resource</text>
<line x1="430" y1="652.2" x2="820" y2="652.2" stroke="#1E293B" stroke-width="1.8"  marker-start="url(#ar)" marker-end="url(#a)"/>
<text x="625" y="639.2" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">5. Fetch AS metadata (RFC 8414 / OIDC) + verify S256 PKCE</text>
<line x1="430" y1="689.0" x2="820" y2="689.0" stroke="#1E293B" stroke-width="1.8"  marker-start="url(#ar)" marker-end="url(#a)"/>
<text x="625" y="676.0" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">6. Get client_id: Pre-registered &gt; CIMD &gt; DCR (legacy fallback)</text>
<line x1="424" y1="725.8" x2="250" y2="725.8" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="388" y="712.8" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">7. Open /authorize + PKCE S256 + resource + state + redirect_uri</text>
<line x1="244" y1="762.6" x2="820" y2="762.6" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="535" y="749.6" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">8. User signs in &amp; approves least-privilege scopes</text>
<line x1="826" y1="799.4" x2="250" y2="799.4" stroke="#1E293B" stroke-width="1.8" stroke-dasharray="6,4"  marker-end="url(#a)"/>
<text x="535" y="786.4" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">9. Redirect callback with code + state + iss (RFC 9207)</text>
<line x1="244" y1="836.2" x2="418" y2="836.2" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="386" y="823.2" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">10. Callback -&gt; client verifies state &amp; iss match (blocks CSRF/mix-up)</text>
<line x1="424" y1="873.0" x2="820" y2="873.0" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="625" y="860.0" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">11. POST /token + code_verifier + redirect_uri + resource</text>
<line x1="826" y1="909.8" x2="430" y2="909.8" stroke="#1E293B" stroke-width="1.8" stroke-dasharray="6,4"  marker-end="url(#a)"/>
<text x="625" y="896.8" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">12. Access token (aud = this MCP server) + refresh_token</text>
<line x1="424" y1="946.6" x2="618" y2="946.6" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="524" y="933.6" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">13. POST /mcp + Authorization: Bearer &lt;token&gt; + Mcp-Session-Id</text>
<path d="M624,965.9 L652,965.9 L652,981.9 L630,981.9" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#a)"/>
<text x="660" y="977.9" font-size="11.5" font-weight="700" fill="#0F172A">14. Validate signature, exp, aud == self, scope</text>
<line x1="630" y1="1020.2" x2="820" y2="1020.2" stroke="#1E293B" stroke-width="1.8"  marker-start="url(#ar)" marker-end="url(#a)"/>
<text x="725" y="1007.2" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">15. RFC 8693 OBO token swap (or per-user Token Vault)</text>
<line x1="624" y1="1057.0" x2="984" y2="1057.0" stroke="#1E293B" stroke-width="1.8"   marker-end="url(#a)"/>
<text x="807" y="1044.0" text-anchor="middle" font-size="11.2" font-weight="700" fill="#0F172A">16. Call upstream with caller-scoped OBO token -&gt; 200 OK</text>
<rect x="36" y="1084" width="1008" height="36" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="540" y="1107" text-anchor="middle" font-size="11.8" font-weight="700" fill="#78350F">Step-Up: missing scope -&gt; 403 insufficient_scope -&gt; incremental re-auth  |  Headless / M2M Agents: ID-JAG (RFC 7523 + 8693) or client_credentials</text>
<rect x="20" y="1140" width="1040" height="174" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M20,1154 a14,14 0 0 1 14,-14 h1012 a14,14 0 0 1 14,14 v20 h-1040 z" fill="#1E293B"/>
<text x="540" y="1163" text-anchor="middle" font-size="16" font-weight="800" fill="#FDE047">Enterprise Security Rules Baked In</text>
<text x="1046" y="1162" text-anchor="end" font-size="11" font-weight="700" fill="#E2E8F0">ZERO-TRUST CHECKLIST</text>
<rect x="34" y="1186" width="244" height="116" rx="10" fill="#ECFDF5" stroke="#BBF7D0" stroke-width="1.5"/>
<circle cx="52" cy="1204" r="10" fill="#2563EB"/>
<text x="52" y="1208" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
<text x="46" y="1232" font-size="13" font-weight="800" fill="#0F172A">PKCE S256 + state + iss</text>
<text x="46" y="1252" font-size="10.6" fill="#1E293B">Mandatory S256 PKCE, state CSRF check,</text>
<text x="46" y="1266" font-size="10.6" fill="#1E293B">exact redirect_uri, and iss (RFC 9207)</text>
<text x="46" y="1280" font-size="10.6" fill="#1E293B">validation stop code interception &amp;</text>
<text x="46" y="1294" font-size="10.6" fill="#1E293B">mix-up.</text>
<rect x="290" y="1186" width="244" height="116" rx="10" fill="#ECFDF5" stroke="#BBF7D0" stroke-width="1.5"/>
<circle cx="308" cy="1204" r="10" fill="#7C3AED"/>
<text x="308" y="1208" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
<text x="302" y="1232" font-size="13" font-weight="800" fill="#0F172A">Audience-bound (RFC 8707)</text>
<text x="302" y="1252" font-size="10.6" fill="#1E293B">The resource parameter binds every</text>
<text x="302" y="1266" font-size="10.6" fill="#1E293B">token (aud) to a single MCP server.</text>
<text x="302" y="1280" font-size="10.6" fill="#1E293B">Resource servers reject cross-server</text>
<text x="302" y="1294" font-size="10.6" fill="#1E293B">tokens.</text>
<rect x="546" y="1186" width="244" height="116" rx="10" fill="#ECFDF5" stroke="#BBF7D0" stroke-width="1.5"/>
<circle cx="564" cy="1204" r="10" fill="#059669"/>
<text x="564" y="1208" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">3</text>
<text x="558" y="1232" font-size="13" font-weight="800" fill="#0F172A">No passthrough -&gt; OBO</text>
<text x="558" y="1252" font-size="10.6" fill="#1E293B">Never forward the client’s MCP token</text>
<text x="558" y="1266" font-size="10.6" fill="#1E293B">or share static server keys. Exchange</text>
<text x="558" y="1280" font-size="10.6" fill="#1E293B">via RFC 8693 OBO or a per-user Token</text>
<text x="558" y="1294" font-size="10.6" fill="#1E293B">Vault.</text>
<rect x="802" y="1186" width="244" height="116" rx="10" fill="#ECFDF5" stroke="#BBF7D0" stroke-width="1.5"/>
<circle cx="820" cy="1204" r="10" fill="#D97706"/>
<text x="820" y="1208" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">4</text>
<text x="814" y="1232" font-size="13" font-weight="800" fill="#0F172A">Least-privilege &amp; step-up</text>
<text x="814" y="1252" font-size="10.6" fill="#1E293B">Ask only for challenged scopes.</text>
<text x="814" y="1266" font-size="10.6" fill="#1E293B">Missing permissions return 403</text>
<text x="814" y="1280" font-size="10.6" fill="#1E293B">insufficient_scope to trigger</text>
<text x="814" y="1294" font-size="10.6" fill="#1E293B">incremental re-auth.</text>
<text x="24" y="1336" font-size="11" font-weight="800" fill="#0F172A">NITIN AGGARWAL · PRINCIPAL AI ARCHITECT, GOOGLE CLOUD</text>
<text x="1056" y="1336" text-anchor="end" font-size="11" font-weight="700" fill="#475569">MCP 2025-11-25 · OAUTH 2.1 · RFC 9728 · RFC 8707 · RFC 9207 · RFC 8693 OBO</text>
</svg>